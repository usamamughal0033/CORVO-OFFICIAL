<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drops — CORVO</title>
<meta name="description" content="CORVO — a thrift community. One-of-one shirts, pants, shoes, belts & caps, jewelry and antique pieces. DM to buy.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-weight='900' font-style='italic' font-size='40' fill='%23fff' text-anchor='middle'%3Ec%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Unbounded:wght@600..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=51">
</head>
<body data-page="shop">
<main class="shop">
  <!-- One-line header: bold title, category links, count. -->
  <header class="shop-top">
    <h1 class="shop-title">All Drops</h1>
    <nav class="chips" id="chips" aria-label="Categories"></nav>
    <p class="shop-count"><b id="shopCount"></b></p>
  </header>
  <div class="wall-wrap"><div class="wall" id="wall"></div></div>
</main>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mName">
  <div class="modal-bg" data-close></div>
  <div class="modal-box">
    <div class="m-gal">
      <div class="m-main" id="mMain"></div>
      <div class="m-thumbs" id="mThumbs"></div>
    </div>
    <div class="m-info">
      <button class="m-close" data-close><span class="split">Close ✕</span></button>
      <p class="m-cat" id="mCat"></p>
      <h2 class="m-name" id="mName"></h2>
      <p class="m-price" id="mPrice"></p>
      <dl class="m-specs">
        <dt>Size</dt><dd id="mSize"></dd>
        <dt>Condition</dt><dd id="mCond"></dd>
        <dt>Stock</dt><dd>One of one</dd>
      </dl>
      <p class="m-note" id="mNote"></p>
      <div class="m-actions">
        <a class="btn solid" id="mWa" target="_blank" rel="noopener"><span class="split">Order on WhatsApp</span><span>↗</span></a>
        <a class="btn" id="mMail"><span class="split">Email us</span><span>↗</span></a>
        <p class="m-how">DM to buy — message us, we confirm availability, you pay and we deliver. First to pay gets the piece.</p>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/config.js?v=51"></script>
<script src="assets/js/products.js?v=51"></script>
<script src="assets/js/main.js?v=51"></script>
</body>
</html>
